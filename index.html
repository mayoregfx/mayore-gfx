<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Lò Thu Thảo</title>
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(-45deg, #ff7eb3, #ff758c, #8fd3f4, #2575fc);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .stars-pattern {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255,255,255,0.3) 1px, transparent 1px),
                radial-gradient(circle at 85% 30%, rgba(255,255,255,0.4) 1.5px, transparent 1.5px),
                radial-gradient(circle at 50% 80%, rgba(255,255,255,0.3) 1px, transparent 1px);
            background-size: 150px 150px;
            z-index: 1;
            pointer-events: none;
        }

        #fireworksCanvas, #particleCanvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }
        #particleCanvas { z-index: 2; }
        #fireworksCanvas { z-index: 3; }

        .glass-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 550px;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 35px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            text-align: center;
            animation: popIn 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards, floatCard 4s ease-in-out infinite 1.5s;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: translateY(40px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes floatCard {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .subtitle {
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 5px;
            font-weight: 700;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }

        .title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(3.5rem, 8vw, 5rem);
            font-weight: 700;
            line-height: 1.2;
            margin: 5px 0 20px 0;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 30px #ff7eb3;
            animation: pulseText 2s infinite;
        }

        @keyframes pulseText {
            0% { transform: scale(1); text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 30px #ff7eb3; }
            50% { transform: scale(1.05); text-shadow: 0 0 25px rgba(255, 255, 255, 1), 0 0 50px #ff758c; }
            100% { transform: scale(1); text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 30px #ff7eb3; }
        }

        .date {
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #333;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.8);
            padding: 8px 25px;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .message {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #fff;
            font-weight: 600;
            margin-bottom: 35px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .btn-wish {
            background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
            color: white;
            border: none;
            padding: 16px 45px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 8, 68, 0.4);
            transition: all 0.3s ease;
        }

        .btn-wish:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 35px rgba(255, 8, 68, 0.6);
        }

        @media (max-width: 600px) {
            .glass-card { padding: 40px 25px; border-radius: 25px; }
            .message { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="stars-pattern"></div>
    <canvas id="particleCanvas"></canvas>
    <canvas id="fireworksCanvas"></canvas>

    <div class="glass-card">
        <h2 class="subtitle">🎉 Chúc Mừng Sinh Nhật 🎉</h2>
        <h1 class="title">Lò Thu Thảo</h1>
        
        <div class="date">13 - 10 - 2026</div>
        
        <p class="message">
            Chúc Thảo tuổi mới luôn xinh đẹp, ngọt ngào và rạng rỡ như bầu trời hôm nay. Chúc mọi điều tốt đẹp nhất sẽ đến với cậu, thành công rực rỡ và luôn ngập tràn tiếng cười nhé! 💖✨
        </p>
        
        <button class="btn-wish" id="wishBtn">🎇 Bắn Pháo Hoa! 🎇</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let audioCtx;
            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }

            function playBupSound() {
                if (!audioCtx) return;
                const time = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(450, time);
                osc.frequency.exponentialRampToValueAtTime(40, time + 0.15);

                gain.gain.setValueAtTime(0.7, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.15);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(time);
                osc.stop(time + 0.15);
            }

            const fCanvas = document.getElementById('fireworksCanvas');
            const fCtx = fCanvas.getContext('2d');
            let fwParticles = [];
            
            function resizeFwCanvas() {
                fCanvas.width = window.innerWidth;
                fCanvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeFwCanvas);
            resizeFwCanvas();

            class FWParticle {
                constructor(x, y, color) {
                    this.x = x; this.y = y; this.color = color;
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 9 + 2;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.alpha = 1;
                    this.decay = Math.random() * 0.015 + 0.015; 
                    this.gravity = 0.15; 
                    this.size = Math.random() * 4 + 1.5; 
                }
                update() {
                    this.vx *= 0.97; this.vy *= 0.97; this.vy += this.gravity;
                    this.x += this.vx; this.y += this.vy; this.alpha -= this.decay;
                }
                draw() {
                    fCtx.save();
                    fCtx.globalAlpha = this.alpha;
                    fCtx.beginPath();
                    fCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    fCtx.fillStyle = this.color; 
                    fCtx.shadowBlur = 10;
                    fCtx.shadowColor = this.color;
                    fCtx.fill();
                    fCtx.restore();
                }
            }

            function createExplosion(x, y) {
                const particleCount = 100; 
                const colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#ff6b81', '#ffffff'];
                const selectedColor = colors[Math.floor(Math.random() * colors.length)];
                for (let i = 0; i < particleCount; i++) {
                    fwParticles.push(new FWParticle(x, y, selectedColor));
                }
                playBupSound();
            }

            function animateFireworks() {
                requestAnimationFrame(animateFireworks);
                fCtx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                fCtx.clearRect(0, 0, fCanvas.width, fCanvas.height);
                for (let i = fwParticles.length - 1; i >= 0; i--) {
                    fwParticles[i].update(); 
                    fwParticles[i].draw();
                    if (fwParticles[i].alpha <= 0) fwParticles.splice(i, 1);
                }
            }
            animateFireworks();

            const wishBtn = document.getElementById('wishBtn');
            
            wishBtn.addEventListener('click', () => {
                initAudio();
                
                wishBtn.style.transform = "scale(0.95)";
                setTimeout(() => { wishBtn.style.transform = ""; }, 150);

                confetti({ particleCount: 100, spread: 80, origin: { y: 0.9 }, zIndex: 100, colors: ['#ff7eb3', '#8fd3f4', '#ffffff', '#ffdf00'] });

                const explosions = 5; 
                for(let i=0; i<explosions; i++) {
                    setTimeout(() => {
                        const randomX = Math.random() * (window.innerWidth - 100) + 50;
                        const randomY = Math.random() * (window.innerHeight / 2);
                        createExplosion(randomX, randomY);
                    }, i * 350); 
                }
            });
        });
    </script>
</body>
</html>
